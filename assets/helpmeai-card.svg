<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 220" width="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240722"/>
      <stop offset="100%" stop-color="#0b020a"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f355da"/>
      <stop offset="100%" stop-color="#ff3366"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&amp;family=Share+Tech+Mono&amp;display=swap');
    
    .title {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 18px;
      fill: #ffffff;
    }
    .desc {
      font-family: 'Outfit', sans-serif;
      font-size: 11.5px;
      fill: #a68ba3;
    }
    .bullet {
      font-family: 'Outfit', sans-serif;
      font-size: 11.5px;
      fill: #eddceb;
    }
    .tech {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      fill: #f355da;
    }
    
    @keyframes borderGlow {
      0%, 100% { stroke-opacity: 0.3; }
      50% { stroke-opacity: 0.9; }
    }
    @keyframes pulseNode {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    @keyframes lineScan {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    
    .glow-border {
      animation: borderGlow 4s ease-in-out infinite;
    }
    .pulse-element {
      animation: pulseNode 3s ease-in-out infinite;
    }
    .scanning-line {
      stroke-dasharray: 10, 15;
      animation: lineScan 4s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="380" height="220" rx="8" fill="url(#bgGrad)" stroke="#300e2d" stroke-width="1.5"/>

  <!-- Tech Grid/Lines -->
  <line x1="330" y1="0" x2="330" y2="220" stroke="#260924" stroke-width="0.8" stroke-dasharray="4,4"/>
  <line x1="0" y1="180" x2="380" y2="180" stroke="#260924" stroke-width="0.8"/>
  <circle cx="330" cy="180" r="3" fill="#f355da" class="pulse-element"/>
  <line class="scanning-line" x1="15" y1="15" x2="365" y2="15" stroke="url(#pinkGrad)" stroke-width="1" opacity="0.4"/>

  <!-- Animated Border Outline Overlay -->
  <rect class="glow-border" width="376" height="216" x="2" y="2" rx="6" fill="none" stroke="url(#pinkGrad)" stroke-width="1.5" filter="url(#glow)"/>

  <!-- Icon -->
  <g transform="translate(20, 28)">
    <rect width="32" height="32" rx="6" fill="#0d020c" stroke="#f355da" stroke-width="1" filter="url(#glow)"/>
    <!-- Robot SVG Icon -->
    <rect x="9" y="12" width="14" height="10" rx="2" fill="none" stroke="#f355da" stroke-width="1.5"/>
    <line x1="12" y1="9" x2="20" y2="9" stroke="#f355da" stroke-width="1.5"/>
    <line x1="16" y1="9" x2="16" y2="12" stroke="#f355da" stroke-width="1"/>
    <circle cx="13" cy="17" r="1" fill="#f355da"/>
    <circle cx="19" cy="17" r="1" fill="#f355da"/>
  </g>

  <!-- Title & Description -->
  <text x="64" y="44" class="title">Helpme.ai</text>
  <text x="64" y="60" class="tech" opacity="0.85">&gt; RESUME OPTIMIZATION ENGINE</text>
  
  <text x="20" y="85" class="desc">An intelligent AI-powered resume review assistant that scans</text>
  <text x="20" y="101" class="desc">CV metrics, suggests writing improvements, and scores layout.</text>

  <!-- Bullets -->
  <g transform="translate(20, 118)">
    <polygon points="0,4 6,7 0,10" fill="#f355da"/>
    <text x="14" y="8" class="bullet">Skill-to-job matching keyword gap analysis</text>
  </g>
  <g transform="translate(20, 136)">
    <polygon points="0,4 6,7 0,10" fill="#f355da"/>
    <text x="14" y="8" class="bullet">Automated suggestion revisions and scoring parameters</text>
  </g>

  <!-- Tech Badges Footer -->
  <g transform="translate(20, 197)">
    <rect width="45" height="15" rx="3" fill="#240722" stroke="#f355da" stroke-width="0.5"/>
    <text x="22.5" y="11" font-family="'Share Tech Mono', monospace" font-size="8" fill="#ffffff" text-anchor="middle">Python</text>
  </g>
  <g transform="translate(71, 197)">
    <rect width="50" height="15" rx="3" fill="#240722" stroke="#f355da" stroke-width="0.5"/>
    <text x="25" y="11" font-family="'Share Tech Mono', monospace" font-size="8" fill="#ffffff" text-anchor="middle">NLP / LLM</text>
  </g>
  <g transform="translate(127, 197)">
    <rect width="55" height="15" rx="3" fill="#240722" stroke="#f355da" stroke-width="0.5"/>
    <text x="27.5" y="11" font-family="'Share Tech Mono', monospace" font-size="8" fill="#ffffff" text-anchor="middle">FastAPI</text>
  </g>

  <!-- Interactive status node -->
  <text x="360" y="200" font-family="'Share Tech Mono', monospace" font-size="9" fill="#f355da" text-anchor="end">[ACTIVE]</text>
</svg>
