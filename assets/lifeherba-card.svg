<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 220" width="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051c18"/>
      <stop offset="100%" stop-color="#02080a"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#00b9f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&amp;family=Share+Tech+Mono&amp;display=swap');
    
    .title {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 18px;
      fill: #ffffff;
    }
    .desc {
      font-family: 'Outfit', sans-serif;
      font-size: 11.5px;
      fill: #8ca39f;
    }
    .bullet {
      font-family: 'Outfit', sans-serif;
      font-size: 11.5px;
      fill: #d1dfdd;
    }
    .tech {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      fill: #00f5a0;
    }
    
    @keyframes borderGlow {
      0%, 100% { stroke-opacity: 0.3; }
      50% { stroke-opacity: 0.9; }
    }
    @keyframes pulseNode {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    @keyframes lineScan {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    
    .glow-border {
      animation: borderGlow 4s ease-in-out infinite;
    }
    .pulse-element {
      animation: pulseNode 3s ease-in-out infinite;
    }
    .scanning-line {
      stroke-dasharray: 10, 15;
      animation: lineScan 4s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="380" height="220" rx="8" fill="url(#bgGrad)" stroke="#112a25" stroke-width="1.5"/>

  <!-- Tech Design Grid/Lines -->
  <line x1="330" y1="0" x2="330" y2="220" stroke="#0e2420" stroke-width="0.8" stroke-dasharray="4,4"/>
  <line x1="0" y1="180" x2="380" y2="180" stroke="#0e2420" stroke-width="0.8"/>
  <circle cx="330" cy="180" r="3" fill="#00f5a0" class="pulse-element"/>
  <line class="scanning-line" x1="15" y1="15" x2="365" y2="15" stroke="url(#greenGrad)" stroke-width="1" opacity="0.4"/>

  <!-- Animated Border Outline Overlay -->
  <rect class="glow-border" width="376" height="216" x="2" y="2" rx="6" fill="none" stroke="url(#greenGrad)" stroke-width="1.5" filter="url(#glow)"/>

  <!-- Icon -->
  <g transform="translate(20, 28)">
    <rect width="32" height="32" rx="6" fill="#030c0a" stroke="#00f5a0" stroke-width="1" filter="url(#glow)"/>
    <!-- Leaf SVG Icon -->
    <path d="M16,8 C12,12 10,17 10,22 L22,22 C22,17 20,12 16,8 Z M16,8 L16,22" fill="none" stroke="#00f5a0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M16,13 C14,15 13,18 13,20" fill="none" stroke="#00f5a0" stroke-width="1" stroke-linecap="round"/>
    <path d="M16,16 C18,17 19,18 20,20" fill="none" stroke="#00f5a0" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Title & Description -->
  <text x="64" y="44" class="title">LifeHerba</text>
  <text x="64" y="60" class="tech" opacity="0.85">&gt; DIGITAL HEALTHCARE PLATFORM</text>
  
  <text x="20" y="85" class="desc">A healthcare portal facilitating doctor consultations and direct</text>
  <text x="20" y="101" class="desc">access to holistic, natural AYUSH prescription orders.</text>

  <!-- Bullets -->
  <g transform="translate(20, 118)">
    <polygon points="0,4 6,7 0,10" fill="#00f5a0"/>
    <text x="14" y="8" class="bullet">Online consultation bookings and digital prescriptions</text>
  </g>
  <g transform="translate(20, 136)">
    <polygon points="0,4 6,7 0,10" fill="#00f5a0"/>
    <text x="14" y="8" class="bullet">E-commerce storefront for organic wellness supplements</text>
  </g>

  <!-- Tech Badges Footer -->
  <g transform="translate(20, 197)">
    <rect width="65" height="15" rx="3" fill="#051f1a" stroke="#00f5a0" stroke-width="0.5"/>
    <text x="32.5" y="11" font-family="'Share Tech Mono', monospace" font-size="8" fill="#ffffff" text-anchor="middle">React Native</text>
  </g>
  <g transform="translate(91, 197)">
    <rect width="60" height="15" rx="3" fill="#051f1a" stroke="#00f5a0" stroke-width="0.5"/>
    <text x="30" y="11" font-family="'Share Tech Mono', monospace" font-size="8" fill="#ffffff" text-anchor="middle">Express.js</text>
  </g>
  <g transform="translate(157, 197)">
    <rect width="50" height="15" rx="3" fill="#051f1a" stroke="#00f5a0" stroke-width="0.5"/>
    <text x="25" y="11" font-family="'Share Tech Mono', monospace" font-size="8" fill="#ffffff" text-anchor="middle">MongoDB</text>
  </g>

  <!-- Interactive status node -->
  <text x="360" y="200" font-family="'Share Tech Mono', monospace" font-size="9" fill="#00f5a0" text-anchor="end">[ONLINE]</text>
</svg>
