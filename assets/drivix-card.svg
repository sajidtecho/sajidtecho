<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 220" width="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c072b"/>
      <stop offset="100%" stop-color="#05021a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&amp;family=Share+Tech+Mono&amp;display=swap');
    
    .title {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 18px;
      fill: #ffffff;
    }
    .desc {
      font-family: 'Outfit', sans-serif;
      font-size: 11.5px;
      fill: #9e9cb6;
    }
    .bullet {
      font-family: 'Outfit', sans-serif;
      font-size: 11.5px;
      fill: #cbd5e1;
    }
    .tech {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      fill: #00f2fe;
    }
    
    @keyframes borderGlow {
      0%, 100% { stroke-opacity: 0.3; }
      50% { stroke-opacity: 0.9; }
    }
    @keyframes pulseNode {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    @keyframes lineScan {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    
    .glow-border {
      animation: borderGlow 4s ease-in-out infinite;
    }
    .pulse-element {
      animation: pulseNode 3s ease-in-out infinite;
    }
    .scanning-line {
      stroke-dasharray: 10, 15;
      animation: lineScan 4s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="380" height="220" rx="8" fill="url(#bgGrad)" stroke="#1a153b" stroke-width="1.5"/>

  <!-- Tech Design Grid/Lines -->
  <line x1="330" y1="0" x2="330" y2="220" stroke="#1c1547" stroke-width="0.8" stroke-dasharray="4,4"/>
  <line x1="0" y1="180" x2="380" y2="180" stroke="#1c1547" stroke-width="0.8"/>
  <circle cx="330" cy="180" r="3" fill="#00f2fe" class="pulse-element"/>
  <line class="scanning-line" x1="15" y1="15" x2="365" y2="15" stroke="url(#cyanGrad)" stroke-width="1" opacity="0.4"/>

  <!-- Animated Border Outline Overlay -->
  <rect class="glow-border" width="376" height="216" x="2" y="2" rx="6" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" filter="url(#glow)"/>

  <!-- Icon -->
  <g transform="translate(20, 28)">
    <rect width="32" height="32" rx="6" fill="#0c072b" stroke="#00f2fe" stroke-width="1" filter="url(#glow)"/>
    <!-- Car / Parking SVG Icon -->
    <path d="M22,18 L22,23 M10,18 L10,23 M7,13 L25,13 L24,19 L8,19 Z M12,9 L20,9 L23,13 L9,13 Z" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="11" cy="16" r="1.5" fill="#00f2fe"/>
    <circle cx="21" cy="16" r="1.5" fill="#00f2fe"/>
  </g>

  <!-- Title & Description -->
  <text x="64" y="44" class="title">Drivix &amp; Drivix-App</text>
  <text x="64" y="60" class="tech" opacity="0.85">&gt; SMART PARKING ECOSYSTEM</text>
  
  <text x="20" y="85" class="desc">A smart parking management platform designed to eliminate</text>
  <text x="20" y="101" class="desc">urban parking anxiety and time-loss.</text>

  <!-- Bullets -->
  <g transform="translate(20, 118)">
    <polygon points="0,4 6,7 0,10" fill="#00f2fe"/>
    <text x="14" y="8" class="bullet">Real-time parking space booking and reservations</text>
  </g>
  <g transform="translate(20, 136)">
    <polygon points="0,4 6,7 0,10" fill="#00f2fe"/>
    <text x="14" y="8" class="bullet">Driver dashboard and navigation assistance</text>
  </g>

  <!-- Tech Badges Footer -->
  <g transform="translate(20, 197)">
    <rect width="50" height="15" rx="3" fill="#1b1348" stroke="#00f2fe" stroke-width="0.5"/>
    <text x="25" y="11" font-family="'Share Tech Mono', monospace" font-size="8" fill="#ffffff" text-anchor="middle">React</text>
  </g>
  <g transform="translate(76, 197)">
    <rect width="60" height="15" rx="3" fill="#1b1348" stroke="#00f2fe" stroke-width="0.5"/>
    <text x="30" y="11" font-family="'Share Tech Mono', monospace" font-size="8" fill="#ffffff" text-anchor="middle">Android</text>
  </g>
  <g transform="translate(142, 197)">
    <rect width="65" height="15" rx="3" fill="#1b1348" stroke="#00f2fe" stroke-width="0.5"/>
    <text x="32.5" y="11" font-family="'Share Tech Mono', monospace" font-size="8" fill="#ffffff" text-anchor="middle">Firebase</text>
  </g>

  <!-- Interactive status node -->
  <text x="360" y="200" font-family="'Share Tech Mono', monospace" font-size="9" fill="#00f2fe" text-anchor="end">[ACTIVE]</text>
</svg>
