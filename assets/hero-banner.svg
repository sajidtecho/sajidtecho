<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a051b"/>
      <stop offset="50%" stop-color="#0c0a24"/>
      <stop offset="100%" stop-color="#02010a"/>
    </linearGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- Neon Purple/Pink Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f355da"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#221e52" stroke-width="0.7" opacity="0.3"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Google Fonts import */
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&amp;family=Share+Tech+Mono&amp;display=swap');

    .title {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#cyanGrad);
      filter: url(#glow-cyan);
      letter-spacing: 1px;
    }

    .subtitle {
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: 18px;
      fill: #ffffff;
      opacity: 0.9;
      letter-spacing: 2px;
    }

    .tagline {
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      fill: #a5a1e2;
      letter-spacing: 1px;
    }

    /* Keyframe Animations */
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(3deg); }
    }

    @keyframes float-reverse {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(8px) rotate(-3deg); }
    }

    @keyframes gridScan {
      0% { transform: translateY(0px); opacity: 0.1; }
      50% { opacity: 0.4; }
      100% { transform: translateY(350px); opacity: 0.1; }
    }

    @keyframes dash {
      to {
        stroke-dashoffset: -40;
      }
    }

    @keyframes beam {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: -200; }
    }

    @keyframes nodePulse {
      0%, 100% { r: 3px; opacity: 0.5; }
      50% { r: 6px; opacity: 1; }
    }

    /* Animation Classes */
    .grid-bg {
      animation: pulse 8s ease-in-out infinite;
    }

    .scan-line {
      animation: gridScan 6s linear infinite;
    }

    .floating-box-1 {
      transform-origin: 650px 100px;
      animation: float 6s ease-in-out infinite;
    }

    .floating-box-2 {
      transform-origin: 700px 240px;
      animation: float-reverse 7s ease-in-out infinite;
    }

    .floating-box-3 {
      transform-origin: 580px 200px;
      animation: float 8s ease-in-out infinite;
    }

    .connector-line {
      stroke-dasharray: 8, 8;
      animation: dash 2s linear infinite;
    }

    .laser-beam {
      stroke-dasharray: 40, 160;
      animation: beam 4s linear infinite;
    }

    .node {
      animation: nodePulse 3s ease-in-out infinite;
    }

    .node-delay-1 {
      animation: nodePulse 3.5s ease-in-out infinite;
      animation-delay: 1s;
    }

    .node-delay-2 {
      animation: nodePulse 4s ease-in-out infinite;
      animation-delay: 2s;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Glowing Grid Backing -->
  <rect class="grid-bg" width="100%" height="100%" fill="url(#grid)"/>

  <!-- Scanning Line -->
  <line class="scan-line" x1="0" y1="0" x2="800" y2="0" stroke="#f355da" stroke-width="1.5" opacity="0.3" filter="url(#glow-purple)"/>

  <!-- Sci-Fi Technical Lines / Digital Background -->
  <g opacity="0.4">
    <!-- Diagonal background lanes -->
    <line x1="450" y1="-50" x2="850" y2="350" stroke="#1f1a54" stroke-width="1"/>
    <line x1="500" y1="-50" x2="900" y2="350" stroke="#1f1a54" stroke-width="2"/>
    <line x1="400" y1="-50" x2="800" y2="350" stroke="#221e52" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="300" y1="-50" x2="700" y2="350" stroke="#100b33" stroke-width="1.5"/>
  </g>

  <!-- Animated Tech Laser Beams -->
  <g opacity="0.6">
    <line class="laser-beam" x1="500" y1="-50" x2="900" y2="350" stroke="url(#cyanGrad)" stroke-width="1.5" filter="url(#glow-cyan)"/>
    <line class="laser-beam" x1="450" y1="-50" x2="850" y2="350" stroke="url(#purpleGrad)" stroke-width="1.5" filter="url(#glow-purple)"/>
  </g>

  <!-- Neural Network / AI Nodes & Connections (interactive look) -->
  <g opacity="0.8">
    <!-- Connections -->
    <line class="connector-line" x1="580" y1="200" x2="650" y2="100" stroke="#4facfe" stroke-width="1"/>
    <line class="connector-line" x1="650" y1="100" x2="700" y2="240" stroke="#f355da" stroke-width="1"/>
    <line class="connector-line" x1="580" y1="200" x2="700" y2="240" stroke="#7000ff" stroke-width="0.8"/>
    <line x1="500" y1="140" x2="580" y2="200" stroke="#221e52" stroke-width="1"/>
    <line x1="650" y1="100" x2="740" y2="60" stroke="#221e52" stroke-width="1"/>
    <line x1="700" y1="240" x2="770" y2="180" stroke="#221e52" stroke-width="1"/>

    <!-- Small decorative lines -->
    <circle cx="500" cy="140" r="2.5" fill="#4facfe" opacity="0.6"/>
    <circle cx="740" cy="60" r="2.5" fill="#f355da" opacity="0.6"/>
    <circle cx="770" cy="180" r="2.5" fill="#7000ff" opacity="0.6"/>
  </g>

  <!-- Floating Tech Badges (Hexagonal Cyber Cards) -->
  
  <!-- Hex 1: AI / TensorFlow & Python (Top Right) -->
  <g class="floating-box-1">
    <!-- Hexagon Outer Border -->
    <polygon points="650,60 685,80 685,120 650,140 615,120 615,80" fill="#0c072b" stroke="url(#cyanGrad)" stroke-width="1.5" filter="url(#glow-subtle)"/>
    <!-- Central Content / Icon Representation -->
    <path d="M 645,85 L 655,85 L 658,95 L 650,105 L 642,95 Z" fill="#4facfe" opacity="0.8"/>
    <circle cx="650" cy="100" class="node" r="4" fill="#ffffff" filter="url(#glow-cyan)"/>
    <text x="650" y="125" font-family="'Share Tech Mono', monospace" font-size="9" fill="#00f2fe" text-anchor="middle" font-weight="bold">AI &amp; ML</text>
  </g>

  <!-- Hex 2: App Development / Kotlin & Android (Bottom Right) -->
  <g class="floating-box-2">
    <!-- Hexagon Outer Border -->
    <polygon points="700,200 735,220 735,260 700,280 665,260 665,220" fill="#0c072b" stroke="url(#purpleGrad)" stroke-width="1.5" filter="url(#glow-subtle)"/>
    <!-- Android/Kotlin representations -->
    <circle cx="700" cy="235" class="node-delay-1" r="4.5" fill="#ffffff" filter="url(#glow-purple)"/>
    <!-- Miniature Android Head Path -->
    <path d="M694,233 A6,6 0 0,1 706,233 Z" fill="#f355da" opacity="0.8"/>
    <line x1="696" y1="228" x2="693" y2="224" stroke="#f355da" stroke-width="1"/>
    <line x1="704" y1="228" x2="707" y2="224" stroke="#f355da" stroke-width="1"/>
    <text x="700" y="265" font-family="'Share Tech Mono', monospace" font-size="9" fill="#f355da" text-anchor="middle" font-weight="bold">MOBILE</text>
  </g>

  <!-- Hex 3: Web & React / Data Science (Middle Left of grid cluster) -->
  <g class="floating-box-3">
    <!-- Hexagon Outer Border -->
    <polygon points="580,160 615,180 615,220 580,240 545,220 545,180" fill="#0c072b" stroke="#7000ff" stroke-width="1" opacity="0.8"/>
    <!-- React Atom Representation -->
    <ellipse cx="580" cy="200" rx="12" ry="4" fill="none" stroke="#7000ff" stroke-width="0.8" transform="rotate(30, 580, 200)"/>
    <ellipse cx="580" cy="200" rx="12" ry="4" fill="none" stroke="#7000ff" stroke-width="0.8" transform="rotate(90, 580, 200)"/>
    <ellipse cx="580" cy="200" rx="12" ry="4" fill="none" stroke="#7000ff" stroke-width="0.8" transform="rotate(150, 580, 200)"/>
    <circle cx="580" cy="200" class="node-delay-2" r="3" fill="#ffffff" filter="url(#glow-subtle)"/>
    <text x="580" y="225" font-family="'Share Tech Mono', monospace" font-size="9" fill="#a5a1e2" text-anchor="middle">WEB DEV</text>
  </g>

  <!-- Glowing Neural Nodes overlaying the corners of Hexes for extra integration -->
  <circle cx="650" cy="100" class="node" r="4.5" fill="#00f2fe" filter="url(#glow-cyan)"/>
  <circle cx="700" cy="240" class="node-delay-1" r="4.5" fill="#f355da" filter="url(#glow-purple)"/>
  <circle cx="580" cy="200" class="node-delay-2" r="4.5" fill="#7000ff" filter="url(#glow-subtle)"/>

  <!-- Left Side: Typography & Branding Content -->
  <g transform="translate(60, 0)">
    
    <!-- Cyberpunk Decorative Top Tag -->
    <g transform="translate(0, 75)" opacity="0.85">
      <rect x="0" y="0" width="130" height="20" fill="#1b1248" rx="3" stroke="#4facfe" stroke-width="0.5"/>
      <circle cx="10" cy="10" r="4" fill="#00f2fe" class="node"/>
      <text x="24" y="14" font-family="'Share Tech Mono', monospace" font-size="10.5" fill="#e2dffd" font-weight="bold">SYSTEM STATUS: ONLINE</text>
    </g>

    <!-- Main Title: Hi, I'm Sajid -->
    <!-- Gradient fill title with slight pulse glow -->
    <text class="title" x="0" y="142">Hi, I'm Sajid</text>

    <!-- Roles Subtitle -->
    <!-- Beautiful futuristic title -->
    <text class="subtitle" x="2" y="185">CREATING INTELLIGENT SYSTEMS</text>

    <!-- Detailed Tech Sub-info -->
    <g transform="translate(2, 215)">
      <!-- Line 1: Machine Learning & AI Enthusiast -->
      <text class="tagline" x="0" y="0">&gt; AI / ML / Data Science Architect</text>
      <!-- Line 2: Cross‑platform developer -->
      <text class="tagline" x="0" y="20">&gt; Android &amp; Full‑Stack Web Developer</text>
      <!-- Line 3: Motto -->
      <text class="tagline" x="0" y="40">&gt; Transforming data into scalable solutions</text>
    </g>

    <!-- Extra UI Graphic Accents on Left -->
    <g transform="translate(0, 290)">
      <!-- Cyber Bar Decors -->
      <rect x="0" y="0" width="140" height="2" fill="url(#cyanGrad)" filter="url(#glow-cyan)"/>
      <rect x="145" y="0" width="30" height="2" fill="#7000ff"/>
      <rect x="180" y="0" width="10" height="2" fill="#fff" opacity="0.8"/>
      
      <!-- Dots -->
      <circle cx="5" cy="12" r="2" fill="#00f2fe"/>
      <circle cx="15" cy="12" r="2" fill="#00f2fe" opacity="0.7"/>
      <circle cx="25" cy="12" r="2" fill="#00f2fe" opacity="0.4"/>
      
      <!-- Terminal prompt aesthetic -->
      <text x="40" y="16" font-family="'Share Tech Mono', monospace" font-size="11" fill="#4facfe" opacity="0.9">root@sajidtecho:~# _</text>
    </g>

  </g>

  <!-- Outer Sci-Fi Border accents -->
  <rect x="10" y="10" width="780" height="330" fill="none" stroke="#221e52" stroke-width="1" opacity="0.3"/>
  <rect x="15" y="15" width="770" height="320" fill="none" stroke="#221e52" stroke-width="1" stroke-dasharray="20, 20" opacity="0.2"/>
  
  <!-- L-Shaped Corner Borders -->
  <!-- Top Left -->
  <path d="M 8 25 L 8 8 L 25 8" fill="none" stroke="#00f2fe" stroke-width="2.5" filter="url(#glow-cyan)"/>
  <!-- Top Right -->
  <path d="M 792 25 L 792 8 L 775 8" fill="none" stroke="#00f2fe" stroke-width="2.5" filter="url(#glow-cyan)"/>
  <!-- Bottom Left -->
  <path d="M 8 325 L 8 342 L 25 342" fill="none" stroke="#f355da" stroke-width="2.5" filter="url(#glow-purple)"/>
  <!-- Bottom Right -->
  <path d="M 792 325 L 792 342 L 775 342" fill="none" stroke="#f355da" stroke-width="2.5" filter="url(#glow-purple)"/>
</svg>
